<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VC 실전 모의고사</title>
<meta name="description" content="벤처투자분석사 실전 모의고사 1~3회 · 60문항 70분">
<meta property="og:type" content="website">
<meta property="og:title" content="벤처투자분석사 실전 모의고사 1~3회">
<meta property="og:description" content="60문항 마킹 → 채점 → 해설">
<meta property="og:image" content="../og.png">
<meta name="theme-color" content="#1d3a6e">
<link rel="icon" href="../icon-192.png">
<link rel="apple-touch-icon" href="../icon-192.png">
<style>
:root{--bg:#f3f4f7;--card:#fff;--ink:#18202b;--sub:#5f6b7a;--line:#dfe3ea;--pri:#1d3a6e;--priS:#e6ecf7;--mark:#2457d6;--markS:#e7edfc;--ok:#127a46;--okS:#e1f4e9;--no:#c0302b;--noS:#fde9e8;--flag:#b26a00;--flagS:#fff1d6;--fs:16px}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1319;--card:#1a2029;--ink:#e8ecf2;--sub:#9aa5b4;--line:#2c3442;--pri:#8fb0ff;--priS:#1f2b47;--mark:#7ea4ff;--markS:#1f2b47;--ok:#52c58d;--okS:#15301f;--no:#ff7d73;--noS:#3a1c1c;--flag:#f0b04a;--flagS:#3a2c10}}
:root[data-theme=dark]{--bg:#0f1319;--card:#1a2029;--ink:#e8ecf2;--sub:#9aa5b4;--line:#2c3442;--pri:#8fb0ff;--priS:#1f2b47;--mark:#7ea4ff;--markS:#1f2b47;--ok:#52c58d;--okS:#15301f;--no:#ff7d73;--noS:#3a1c1c;--flag:#f0b04a;--flagS:#3a2c10}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:var(--fs)/1.65 system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;word-break:keep-all;overflow-wrap:anywhere}
#app{max-width:680px;margin:0 auto;padding:0 16px calc(90px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding:10px 0 8px;border-bottom:1px solid var(--line)}
.top h1{font-size:1.02em;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;min-width:40px;height:40px;font:inherit;font-size:.92em;cursor:pointer;padding:0 10px}
.timer{font-variant-numeric:tabular-nums;font-weight:800;color:var(--pri);padding:0 4px}
.timer.low{color:var(--no)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.sub{color:var(--sub);font-size:.88em}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.btn{display:block;width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px 14px;font:inherit;text-align:center;cursor:pointer;margin:8px 0}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:700}
.btn.warn{background:var(--no);border-color:var(--no);color:#fff;font-weight:700}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid2 .btn{margin:0}
.big{font-size:1.7em;font-weight:800;line-height:1.2}
.tag{display:inline-block;font-size:.75em;padding:1px 8px;border-radius:99px;background:var(--priS);color:var(--pri);margin:0 4px 2px 0;white-space:nowrap}
.tag.ok{background:var(--okS);color:var(--ok)}.tag.no{background:var(--noS);color:var(--no)}.tag.flag{background:var(--flagS);color:var(--flag)}
.q{white-space:pre-wrap;font-weight:600;margin:6px 0 10px}
.ch{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:11px 12px;margin:7px 0;font:inherit;cursor:pointer}
.ch.sel{border-color:var(--mark);background:var(--markS);font-weight:700}
.ch.ok{border-color:var(--ok);background:var(--okS)}
.ch.no{border-color:var(--no);background:var(--noS)}
.ex{background:var(--priS);border-radius:12px;padding:12px;margin-top:10px;white-space:pre-wrap;font-size:.93em}
.ex .mem{display:block;margin-top:8px;font-weight:700;color:var(--no)}
.omr{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin:6px 0}
.omr button{aspect-ratio:1;border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:8px;font:inherit;font-size:.78em;padding:0;cursor:pointer;position:relative}
.omr button.m{background:var(--markS);color:var(--mark);border-color:var(--mark);font-weight:700}
.omr button.f::after{content:"";position:absolute;top:2px;right:2px;width:6px;height:6px;border-radius:9px;background:var(--flag)}
.omr button.cur{outline:2px solid var(--ink);outline-offset:1px}
.omr button.ok{background:var(--okS);color:var(--ok);border-color:var(--ok)}
.omr button.no{background:var(--noS);color:var(--no);border-color:var(--no);font-weight:700}
.omrh{font-size:.8em;color:var(--sub);margin-top:8px}
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:8px 16px calc(8px + env(safe-area-inset-bottom));z-index:9}
.foot .in{max-width:680px;margin:0 auto;display:flex;gap:8px}
.foot .btn{margin:0;padding:11px 6px}
table.sc{width:100%;border-collapse:collapse;margin-top:8px;font-size:.95em}
table.sc th,table.sc td{border-bottom:1px solid var(--line);padding:8px 4px;text-align:center}
table.sc th{color:var(--sub);font-weight:600;font-size:.85em}
.pass{color:var(--ok);font-weight:800}.fail{color:var(--no);font-weight:800}
.seg{display:flex;gap:6px;margin:8px 0}
.seg button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:10px;padding:8px 4px;font:inherit;font-size:.88em;cursor:pointer}
.seg button.on{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:700}
.banner{background:var(--noS);border-radius:12px;padding:10px 12px;font-size:.88em;margin:8px 0}
input[type=password]{width:100%;font:inherit;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.center{text-align:center}
a{color:var(--mark)}
</style>
</head>
<body>
<div id="app"><div class="card center sub">불러오는 중…</div></div>
<div class="foot" id="foot" hidden><div class="in" id="footIn"></div></div>
<script src="mock.js?v=1"></script>
</body>
</html>
