<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VC 새 핵심문제</title>
<meta name="description" content="벤처투자분석사 새 핵심문제 · 오답 개념 문제">
<meta property="og:type" content="website">
<meta property="og:title" content="벤처투자분석사 새 핵심문제">
<meta property="og:description" content="반복 없는 새 문제 · 틀린 것만 다시">
<meta property="og:image" content="../og.png">
<meta name="theme-color" content="#c0302b">
<link rel="icon" href="../icon-192.png">
<link rel="apple-touch-icon" href="../icon-192.png">
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#18202b;--sub:#5f6b7a;--line:#e2e6ec;--pri:#c0302b;--priS:#fde9e8;--blue:#2457d6;--blueS:#e7edfc;--ok:#127a46;--okS:#e1f4e9;--no:#c0302b;--noS:#fde9e8;--fs:16px}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1319;--card:#1a2029;--ink:#e8ecf2;--sub:#9aa5b4;--line:#2c3442;--pri:#ff7d73;--priS:#3a1c1c;--blue:#7ea4ff;--blueS:#1f2b47;--ok:#52c58d;--okS:#15301f;--no:#ff7d73;--noS:#3a1c1c}}
:root[data-theme=dark]{--bg:#0f1319;--card:#1a2029;--ink:#e8ecf2;--sub:#9aa5b4;--line:#2c3442;--pri:#ff7d73;--priS:#3a1c1c;--blue:#7ea4ff;--blueS:#1f2b47;--ok:#52c58d;--okS:#15301f;--no:#ff7d73;--noS:#3a1c1c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:var(--fs)/1.65 system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;word-break:keep-all;overflow-wrap:anywhere}
#app{max-width:640px;margin:0 auto;padding:12px 16px calc(40px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding:10px 0 8px}
.top h1{font-size:1.05em;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;min-width:40px;height:40px;font:inherit;font-size:.95em;cursor:pointer;padding:0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.sub{color:var(--sub);font-size:.88em}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.btn{display:block;width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:13px 14px;font:inherit;text-align:left;cursor:pointer;margin:8px 0}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff;text-align:center;font-weight:700}
.btn.ghost{background:transparent;text-align:center}
.btn:disabled{opacity:.45}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.grid3 .btn{margin:0;text-align:center;padding:11px 4px;font-size:.92em}
.seg{display:flex;gap:6px;margin:4px 0 2px}
.seg button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:10px;padding:9px 4px;font:inherit;font-size:.9em;cursor:pointer}
.seg button.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}
.big{font-size:1.6em;font-weight:800}
.tag{display:inline-block;font-size:.75em;padding:1px 8px;border-radius:99px;background:var(--blueS);color:var(--blue);margin:0 4px 2px 0;white-space:nowrap}
.tag.no{background:var(--noS);color:var(--no)}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin:6px 0;display:flex}
.bar>i{display:block;height:100%}
.q{white-space:pre-wrap;font-weight:600;margin:4px 0 10px}
.ch{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:11px 12px;margin:7px 0;font:inherit;cursor:pointer}
.ch.ok{border-color:var(--ok);background:var(--okS)}
.ch.no{border-color:var(--no);background:var(--noS)}
.ex{background:var(--blueS);border-radius:12px;padding:12px;margin-top:10px;white-space:pre-wrap;font-size:.93em}
.ex .mem{display:block;margin-top:8px;font-weight:700;color:var(--pri)}
.banner{background:var(--priS);border-radius:12px;padding:10px 12px;font-size:.88em;margin:8px 0}
input{width:100%;font:inherit;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.center{text-align:center}
a{color:var(--blue)}
</style>
</head>
<body>
<div id="app"><div class="card center sub">불러오는 중…</div></div>
<script src="new.js?v=1"></script>
</body>
</html>
