<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>벤처투자분석사 암기</title>
<meta name="description" content="요약 보고, 빈칸으로 외우고, 문제로 확인하는 개인 학습 앱">
<meta property="og:type" content="website">
<meta property="og:title" content="벤처투자분석사 암기 학습">
<meta property="og:description" content="요약 → 빈칸 암기 → 관련 문제 · 오답 복습">
<meta property="og:image" content="og.png">
<meta name="theme-color" content="#2457d6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#18202b;--sub:#5f6b7a;--line:#e2e6ec;--pri:#2457d6;--priS:#e7edfc;--ok:#127a46;--okS:#e1f4e9;--no:#c0302b;--noS:#fde9e8;--warn:#9a5b00;--warnS:#fff4dd;--hl:#fff1a8;--fs:16px}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1319;--card:#1a2029;--ink:#e8ecf2;--sub:#9aa5b4;--line:#2c3442;--pri:#7ea4ff;--priS:#1f2b47;--ok:#52c58d;--okS:#15301f;--no:#ff7d73;--noS:#3a1c1c;--warn:#f0b04a;--warnS:#3a2c10;--hl:#5a4b00}}
:root[data-theme=dark]{--bg:#0f1319;--card:#1a2029;--ink:#e8ecf2;--sub:#9aa5b4;--line:#2c3442;--pri:#7ea4ff;--priS:#1f2b47;--ok:#52c58d;--okS:#15301f;--no:#ff7d73;--noS:#3a1c1c;--warn:#f0b04a;--warnS:#3a2c10;--hl:#5a4b00}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:var(--fs)/1.65 system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;word-break:keep-all;overflow-wrap:anywhere}
#app{max-width:640px;margin:0 auto;padding:12px 16px calc(84px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding:10px 0 8px}
.top h1{font-size:1.05em;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{border:0;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;min-width:40px;height:40px;font:inherit;font-size:.95em;cursor:pointer;padding:0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.sub{color:var(--sub);font-size:.88em}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.btn{display:block;width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:13px 14px;font:inherit;text-align:left;cursor:pointer;margin:8px 0}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff;text-align:center;font-weight:700}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid2 .btn{margin:0}
.big{font-size:1.6em;font-weight:800}
.tag{display:inline-block;font-size:.75em;padding:1px 8px;border-radius:99px;background:var(--priS);color:var(--pri);margin:0 4px 2px 0;white-space:nowrap}
.tag.w{background:var(--warnS);color:var(--warn)}
.tag.ok{background:var(--okS);color:var(--ok)}
.tag.no{background:var(--noS);color:var(--no)}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin:6px 0}
.bar>i{display:block;height:100%;background:var(--pri)}
.hl{background:var(--hl);color:inherit;padding:0 2px;border-radius:3px}
.red{color:var(--no)}
ul.pts{margin:6px 0 0;padding-left:1.1em}
ul.pts li{margin:6px 0}
.trap{background:var(--warnS);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:.93em}
.src{font-size:.78em;color:var(--sub);margin-top:8px}
.list .it{display:flex;gap:10px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.list .it:last-child{border-bottom:0}
.list .t{flex:1}
.grp{font-weight:700;color:var(--pri);margin:16px 2px 4px;font-size:.92em}
.cz{font-size:1.08em;line-height:1.9;white-space:pre-wrap}
.blank{display:inline-block;min-width:3.2em;border-bottom:2px solid var(--pri);color:transparent;margin:0 2px;text-align:center}
.blank.show{color:var(--pri);font-weight:800;border-color:var(--ok)}
.q{white-space:pre-wrap;font-weight:600;margin:4px 0 10px}
.ch{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:11px 12px;margin:7px 0;font:inherit;cursor:pointer}
.ch.ok{border-color:var(--ok);background:var(--okS)}
.ch.no{border-color:var(--no);background:var(--noS)}
.ex{background:var(--priS);border-radius:12px;padding:12px;margin-top:10px;white-space:pre-wrap;font-size:.93em}
.steps{display:flex;gap:6px;margin:4px 0 2px}
.steps span{flex:1;text-align:center;font-size:.75em;padding:4px 0;border-radius:8px;background:var(--line);color:var(--sub)}
.steps span.on{background:var(--pri);color:#fff}
.nav[hidden]{display:none}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:9}
.nav button{flex:1;max-width:160px;border:0;background:none;color:var(--sub);font:inherit;font-size:.78em;padding:8px 0 10px;cursor:pointer}
.nav button b{display:block;font-size:1.45em;line-height:1.2}
.nav button.on{color:var(--pri);font-weight:700}
.banner{background:var(--warnS);border-radius:12px;padding:10px 12px;font-size:.88em;margin:8px 0}
input[type=password],input[type=text]{width:100%;font:inherit;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.center{text-align:center}
.muted{opacity:.7}
</style>
</head>
<body>
<div id="app"><div class="card center sub">불러오는 중…</div></div>
<nav class="nav" id="nav" hidden>
  <button data-go="home"><b>🏠</b>홈</button>
  <button data-go="study"><b>📘</b>요약</button>
  <button data-go="review"><b>🧠</b>빈칸</button>
  <button data-go="quizMenu"><b>✍️</b>문제</button>
  <button data-go="stats"><b>📊</b>기록</button>
</nav>
<script src="app.js?v=4"></script>
</body>
</html>
